      // Turns a package folder name (e.g. "module-common-session", "mc-video") into a
      // human-friendly, title-cased module label (e.g. "Common Session", "Video").
      function moduleLabel(moduleKey) {
        const words = moduleKey
          .replace(/^module-/, '')
          .replace(/^mc-/, '')
          .split('-');
        return words
          .map((word) => (word.toLowerCase() === 'ai' ? 'AI' : word.charAt(0).toUpperCase() + word.slice(1)))
          .join(' ');
      }

      const ACTION_OPTIONS = Object.entries(ACTIONS_REGISTRY)
        .flatMap(([moduleKey, actions]) =>
          Object.entries(actions).map(([type, schema]) => ({
            type,
            moduleKey,
            moduleLabel: moduleLabel(moduleKey),
            schema,
          })),
        )
        .sort((a, b) => a.moduleLabel.localeCompare(b.moduleLabel) || a.type.localeCompare(b.type));

      // Converts a schema field type (e.g. "string", "number (optional)") into a
      // representative placeholder value for the recommended payload.
      function exampleValueForType(fieldType) {
        switch ((fieldType || '').replace(' (optional)', '')) {
          case 'string':
            return '';
          case 'number':
            return 0;
          case 'boolean':
            return true;
          default:
            return null;
        }
      }

      // Builds a recommended payload from a registry schema. Returns `undefined`
      // when the action takes no payload at all.
      function buildExamplePayload(schema) {
        if (!schema || schema.type === 'none') return undefined;
        if (schema.type === 'object') {
          const obj = {};
          Object.entries(schema.fields || {}).forEach(([field, fieldType]) => {
            obj[field] = exampleValueForType(fieldType);
          });
          return obj;
        }
        return exampleValueForType(schema.type);
      }

      function StatusChip({ status }) {
        const map = {
          connecting: { color: '#9e9e9e', label: 'Connecting…' },
          connected: { color: '#4caf50', label: 'Connected' },
          error: { color: '#f44336', label: 'Disconnected' },
          missing: { color: '#f44336', label: 'zamok.js not found' },
        };
        const { color, label } = map[status] || map.connecting;
        return (
          <Chip
            size="small"
            variant="outlined"
            label={label}
            icon={
              <Box
                component="span"
                sx={{
                  width: 8,
                  height: 8,
                  borderRadius: '50%',
                  bgcolor: color,
                  display: 'inline-block',
                  ml: '10px',
                }}
              />
            }
          />
        );

      function App() {
        const zamokRef = useRef(null);
        const [connectionStatus, setConnectionStatus] = useState('connecting');
        const [state, setState] = useState(null);
        const [lastAction, setLastAction] = useState(null);
        const [tab, setTab] = useState(0);
        const [selectedType, setSelectedType] = useState('');
        const [payloadText, setPayloadText] = useState('');
        const [dispatchError, setDispatchError] = useState(null);

        useEffect(() => {
          if (!window.Zamok) {
            setConnectionStatus('missing');
            return;
          }

          // Standard connect flow per the shell-api README: construct the client,
          // then wait for `.ready` before doing anything else with it.
          const zamok = window.Zamok.api();
          zamokRef.current = zamok;

          zamok.ready
            .then(() => {
              setConnectionStatus('connected');

              zamok.getState().then((initialState) => setState(initialState));

              zamok.data$.subscribe(({ state: nextState, action }) => {
                setLastAction(action);
                setState((prevState) => {
                  // Skip redundant re-renders when the state hasn't actually changed.
                  if (prevState && JSON.stringify(prevState) === JSON.stringify(nextState)) {
                    return prevState;
                  }
                  return nextState;
                });
              });
            })
            .catch(() => setConnectionStatus('error'));
        }, []);

        const handleActionChange = (event, newValue) => {
          if (newValue && typeof newValue !== 'string') {
            const example = buildExamplePayload(newValue.schema);
            setPayloadText(example === undefined ? '' : JSON.stringify(example, null, 2));
            setDispatchError(null);
          }
        };

        const handleFire = () => {
          const type = selectedType.trim();
          if (!type) {
            setDispatchError('Choose or type an action type first.');
            return;
          }

          let payload;
          if (payloadText.trim()) {
            try {
              payload = JSON.parse(payloadText);
            } catch (e) {
              setDispatchError('Payload is not valid JSON: ' + e.message);
              return;
            }
          }

          setDispatchError(null);
          const action = payload !== undefined ? { type, payload } : { type };

          // We only care about dispatch errors here — the resulting state update
          // will arrive on its own through the data$ subscription above.
          zamokRef.current.dispatch(action).catch((e) => setDispatchError(String((e && e.message) || e)));
        };

        const isConnected = connectionStatus === 'connected';

        return (
          <ThemeProvider theme={theme}>
            <CssBaseline />
            <Box sx={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
              <AppBar
                position="static"
                color="transparent"
                elevation={0}
                sx={{ borderBottom: 1, borderColor: 'divider' }}
              >
                <Toolbar variant="dense" sx={{ gap: 1.5 }}>
                  <Typography variant="subtitle1" sx={{ fontWeight: 700, flexShrink: 0 }}>
                    Zamok API Console
                  </Typography>
                  <Box sx={{ flexGrow: 1 }} />
                  <Tooltip title="This page's origin — must be allowed in Zamok Dashboard > Settings > Webview > API Origins">
                    <Chip
                      size="small"
                      variant="outlined"
                      label={'origin: ' + window.location.origin}
                      sx={{ fontFamily: 'Roboto Mono, monospace' }}
                    />
                  </Tooltip>
                  <StatusChip status={connectionStatus} />
                </Toolbar>
              </AppBar>

              <Box
                sx={{
                  flex: '1 1 50%',
                  minHeight: 0,
                  display: 'flex',
                  flexDirection: 'column',
                  borderBottom: 1,
                  borderColor: 'divider',
                }}
              >
                <Box
                  sx={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: 1,
                    px: 2,
                    py: 1,
                  }}
                >
                  <Typography variant="overline" sx={{ letterSpacing: 1 }}>
                    State
                  </Typography>
                  {lastAction && (
                    <Chip
                      size="small"
                      variant="outlined"
                      label={'last action: ' + lastAction.type}
                      sx={{ fontFamily: 'Roboto Mono, monospace' }}
                    />
                  )}
                  <Box sx={{ flexGrow: 1 }} />
                  <Button
                    size="small"
                    disabled={!state}
                    onClick={() => navigator.clipboard.writeText(JSON.stringify(state, null, 2))}
                  >
                    Copy JSON
                  </Button>
                </Box>
                <Box
                  sx={{
                    flex: 1,
                    minHeight: 0,
                    overflow: 'auto',
                    px: 2,
                    pb: 2,
                    fontFamily: 'Roboto Mono, monospace',
                    fontSize: 13,
                  }}
                >
                  {state ? (
                    <JSONTree
                      data={state}
                      theme={jsonTreeTheme}
                      invertTheme={false}
                      hideRoot
                      shouldExpandNodeInitially={(keyPath, data, level) => level < 1}
                    />
                  ) : (
                    <Typography variant="body2" color="text.secondary">
                      {isConnected ? 'Waiting for state…' : 'Not connected yet.'}
                    </Typography>
                  )}
                </Box>
              </Box>

              <Box
                sx={{
                  flex: '1 1 50%',
                  minHeight: 0,
                  display: 'flex',
                  flexDirection: 'column',
                }}
              >
                <Tabs value={tab} onChange={(e, v) => setTab(v)} sx={{ minHeight: 36, px: 2 }}>
                  <Tab label="Actions" sx={{ minHeight: 36 }} />
                </Tabs>

                {tab === 0 && (
                  <Box
                    sx={{
                      flex: 1,
                      minHeight: 0,
                      overflow: 'auto',
                      p: 2,
                      display: 'flex',
                      flexDirection: 'column',
                      gap: 2,
                      maxWidth: 640,
                    }}
                  >
                    <Autocomplete
                      freeSolo
                      size="small"
                      options={ACTION_OPTIONS}
                      groupBy={(option) => option.moduleLabel}
                      getOptionLabel={(option) => (typeof option === 'string' ? option : option.type)}
                      inputValue={selectedType}
                      onInputChange={(event, newInputValue) => setSelectedType(newInputValue)}
                      onChange={handleActionChange}
                      renderInput={(params) => (
                        <TextField
                          {...params}
                          label="Action type"
                          placeholder="Pick from the registry, or type any action type"
                          InputProps={{
                            ...params.InputProps,
                            sx: { fontFamily: 'Roboto Mono, monospace' },
                          }}
                        />
                      )}
                    />

                    <TextField
                      label="Payload (JSON)"
                      placeholder="Optional — leave empty for actions with no payload"
                      multiline
                      minRows={8}
                      maxRows={16}
                      value={payloadText}
                      onChange={(e) => setPayloadText(e.target.value)}
                      InputProps={{
                        sx: {
                          fontFamily: 'Roboto Mono, monospace',
                          fontSize: 13,
                        },
                      }}
                    />

                    {dispatchError && (
                      <Alert severity="error" onClose={() => setDispatchError(null)}>
                        {dispatchError}
                      </Alert>
                    )}

                    <Box>
                      <Button variant="contained" disabled={!isConnected} onClick={handleFire}>
                        Fire Action
                      </Button>
                    </Box>
                  </Box>
                )}
              </Box>
            </Box>
          </ThemeProvider>
        );
      }

      createRoot(document.getElementById('root')).render(<App />);</script></body></html>
